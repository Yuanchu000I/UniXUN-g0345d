findings = ["M42 decodes phase0x4107/value0x0467=1127; callback index878 is _kalloc_init at0xfffffff0079d6f94, argNULL.", "Fixed parsing, assertions, first qsort and fixed iterators returned; fixed-zone creation and adjacent boundaries have not been observed to return.", "Sending/Booting OKAY only establishes historical transfer/command acceptance, not complete XNU startup.", "At the original M42 publication, experiments were stopped; later authorized iOS observations are recorded separately below.", "The 2026-11-20 official-flow run captured the firmware log before DarwinBoot. It shows successful config open, 4 entries/0 skipped and entry into Advanced Logger; host FAT readback confirms xnu plus matching kernel/report hash and adjacent ADT/hash. The device log does not separately name xnu, and no current-run DarwinBoot/XNU entry is established. A PartitionValidMbr size diagnostic remains untriaged. See docs/bringup/official-flow-20261120.md.", "The user-authorized 2026-11-20 continuation built and packaged an isolated native-only XNU 8796.121.2 MSM8996 diagnostic with one additional green _start probe. The existing logger FD already contains the EBS-success red probe. Image SHA-256 cdd7901533e68d6d455bb6ba11391a96a614309c09ccb9c0b4fc4d05fd1b3c1d; host-only at packaging time, with subsequent photo evidence recorded separately. See docs/bringup/stage4-entry-20261120.md.", "A subsequent user photograph (SHA-256 d41aff43142b2337a22c3fd9b15251902fd7810c93ea2c9a1349f4f99097e046) shows the EBS-success red strip and XNU-entry green strip. Its physical entry address and first four instruction words match the entry-green kernel, while VideoBase=0 excludes the generic firmware green writer. This supports successful EBS return and XNU _start framebuffer stores, but not green-loop exit, the following barrier/branch, start_first_cpu or full Stage 5 platform-expert initialization. No new build or agent device command was performed during photo analysis.", "Under the user standing authorization to build after each completed review, the 2026-11-20 continuation preserved all 41 entry-diagnostic patches and appended one start.s-only pre-MMU checkpoint patch. The isolated native-only XNU 8796.121.2 MSM8996 build returned exit 0 with prelink skipped and no 20F66 donor kexts. Final Mach-O checks verify bounded inline probes, preserved x0/SP/LR, preserved x2/x10 on table exhaustion, the cold-boot-only SCTLR probe, and the retained SCTLR-write/ISB sequence. Source comparison found only start.s changed across 4999 entries. Image SHA-256 8f2936c1eaa65d900aa73a2787c332716e9ce26c7b764e18c19e23326875e387; kernel SHA-256 e0620cd292399b8a6cb0654a6b0101816b3b578fec7b8f4386ff46447cd4eb78. Packaging/readback and an independent Windows image hash agree; FD, non-kernel FAT files and fixed geometry are unchanged. At initial packaging the image was untested, with device_executed=false and boot_verified=false in its host receipts; those historical fields remain unchanged. A subsequent photograph is recorded separately below. See docs/bringup/stage5-cpu-mmu-20261120.md.", "The subsequent CPU/bootstrap photograph shows red, green, blue, cyan, yellow and magenta strips with entry words 580100C9 D290E00A 5280000B 52801FEC matching the final kernel. It supports passage through start_first_cpu, bootstrap mapping construction and common-start setup to the pre-SCTLR stores, not completion of the final probe barrier, SCTLR write, ISB, MMU transition or arm_init. No orange strip is observed. The still photograph does not establish a fault instruction, duration or repeatability; its image association rests on context and matching probe signature.", "After that review the user-authorized isolated build preserved 42 patches and appended one start.s-only patch for a 2 MiB Device/XN framebuffer identity mapping, a cold-only white post-ISB strip at rows240-255 and a gray pre-return strip at rows272-287. The native-only XNU 8796.121.2 MSM8996 build returned exit0 with prelink skipped and no 20F66 donor kexts. Final instructions, actual linked TCR/MAIR, descriptor attributes, bounds/guards and unchanged non-kernel packaging inputs passed checks. Image SHA-256 f9f76d36ebcf560e548d60bda88b847c61b1dcac67f48150d55e196b9b4c3ac6; kernel SHA-256 b0dc5bfcc3ad9c2331e0331dbc0b438dfe985405529dc8b69ff2a47964d38bfa. Independent Windows hashes and all14 evidence hashes agree. At initial packaging this new image had not been device-tested, and the then-current observed boundary was the preceding pre-SCTLR magenta stores; the later v9/v10 note supersedes that checkpoint. Gray would identify pre-return stores, not entry into C arm_init. See docs/bringup/stage5-postmmu-20261120.md.", "Latest v9 white-entry/red-classifier evidence supports actual timebase=0, quotient=0 and index=0xffffffff at stores before the original shift. It lacks an independent full-image transfer digest and does not establish final DSB, subsequent shift/UBSAN, trap PC, exact zero-clock cause, return or stability.", "v10 reuses the exact v9 46-patch kernel and changes nine ADT u64 fields (ten bytes) for a 64KiB MSM8996 window, preserving seven physical ranges and 19.2MHz. Independent FAT/ADT and Windows audits passed; finalization is ready-for-temporary-device-test. v10 is untested; publication performs no device operation.", "Current execution is official Stage 5 after early PE return within WFE/clock initialization. Stage 5 is incomplete; Stage 6 storage/root and Stage 7 userland are unreached. The isolated diagnostic record checker retained exit1 solely for device.soc must match board.toml; public checks do not alter that receipt."]
