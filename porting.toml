evidence = [{ kind = "source", reference = "configs/g0345d_defconfig", result = "Selects boot CPU/platform sources and disables PAN/secondary CPU gates." }, { kind = "source", reference = "dts/g0345d.dts", result = "Provides the board overrides and keeps secondary cores disabled." }, { kind = "source", reference = "docs/bringup/stage5-wfe-v10-20261121.md", result = "Derived v9 classifier observation, ADT-only v10 scope, exact artifact identities, host checks and untested-device limits." }]

