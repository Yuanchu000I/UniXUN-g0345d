schema_version = 1

[device]
name = "g0345d"
soc = "msm8996"
os_profile = "ios-16.5-20F66"
summary = "Experimental GREE G0345D/MSM8996 iPhone iOS 16.5 / 20F66 target. Current native-only XNU 8796.121.2 diagnostics contain 46 ordered patches, skip prelink and include no 20F66 donor kexts. Official Stage 5 remains after early PE return in WFE/clock initialization. Latest v9 evidence supports timebase=0, quotient=0 and index=0xffffffff before the original shift; trap PC and precise zero-clock cause remain unknown. ADT-only v10 passed independent FAT/ADT and Windows host checks, reuses the exact v9 kernel and is untested on hardware. Root XNU 8796.101.5 is a separate proposal with empty board patch lists. iPadOS 17 is abandoned; 51 root patches are retired with history retained. No complete iOS, physical UFS/APFS root or userland qualification is claimed."

[[area]]
id = "configuration"
status = "implemented"
components = ["SoftwareAES"]
paths = ["board.toml", "feeds.toml", "unixnu.lock", "source-pins.toml", "local.toml.example", "configs/*", "docs/os-profile-proposal/ios-16.5-20F66/*", "profiles/os/ios-16.5-20F66/*", "scripts/stage-os-profile.py", "tests/test_stage_os_profile.py", "docs/provenance/*", "scripts/check-repository.py", "ci/*", ".gitignore", ".gitattributes", "LICENSE", "NOTICE", ".github/*", "patches/xnu/series", "diagnostics/ios16-20F66/*"]
inputs = ["GREE G0345D MSM8996 v3.1 board inputs and the proposed iPhone iOS 16.5-20F66 profile.", "Pinned MSM8996 feed and tested midopix tools fork; selected shared components retain their existing IDs."]
configuration = ["board.toml uses schema_version=2 and the g0345d kit/defconfig/DTS.", "The proposal records the verified iPhone10,3/iPhone10,6 20F66 restore URL and BuildManifest donor identity d22ap/0x8015/0x06; component hashes and prelink inputs remain empty.", "The portable runtime profile is in profiles/os/ios-16.5-20F66 and matches the reviewed copy in docs/os-profile-proposal. scripts/stage-os-profile.py installs only its three exact files into an explicitly selected tools checkout, rejecting conflicts and linked paths.", "The current proposed OS patch list is empty, which does not block a CLI build. Do not build until XNU 8796.101.5 inputs and the complete ARM64/MSM8996/G0345D patch order are verified.", "A host-only audit recorded 21 ARM64 candidates plus an MSM8996 apply-check in patch-audit.toml; these remain candidates and are not active build inputs.", "Historical main preserves the retired 51-patch M42 series; this iOS branch removes those root patches and does not republish the incomplete M71 patch set.", "SoftwareAES is selected with source corecrypto/pthread and source crypto bootstrap; functional OS crypto is not qualified.", "Current 46-patch XNU 8796.121.2 diagnostics are separate from root XNU 8796.101.5. The 51 iPadOS patches are retired; root series and board patch_series remain empty."]
procedure = ["Review source-pins.toml, feeds.toml, unixnu.lock and the functional source snapshot before resolving a tree.", "Use the pinned tools checkout for defconfig, fetch and status review; run the repository integrity and structured-record checks."]
findings = ["The hardware identity remains G0345D/MSM8996. iPhone10,3/iPhone10,6 is a proposed iPhone OS donor identity, not the target board.", "The pinned resolver requires the OS directory inside its tools checkout. The staging script creates only the three runtime files, validates conflicts before writing, and is idempotent. It rejects Windows directory junctions on Python 3.11 through reparse-point metadata. Offline tests cover check mode, idempotence, conflicts, and junction rejection; one symlink-creation test is skipped when the host denies that privilege. Staging does not apply the separately required tools compatibility patch.", "The host patch audit's 21 ARM64 candidates and follow-on MSM8996 check passed mechanically, but the G0345D device layer and the full 8796 stack are not yet reviewed together.", "A separate host build used XNU 8796.121.2 but selected DEVELOPMENT_ARM64_BCM2837. Its ARM64 static audit passed; it is not an MSM8996 target build. The machine-layer audit records missing XNU and tooling support.", "The historical M42 snapshot and later M71/v213 development report use XNU 10063.141.1 and are not evidence for XNU 8796.101.5. The M71 patch set and full receipts are not included in this published revision.", "The base commits plus retained local deltas identify historical provenance; they do not certify a clean end-to-end iOS 16.5 reproduction.", "Publication preserves the owner-created GitHub initial commit and archives its original license without replacing inherited source licensing.", "On 2026-11-21 all 51 retired root patches matched the unchanged source-snapshot hashes with no uncommitted patch modifications before deletion. History remains at 53ce24cd0e727914f4e25f32b44815cd00885774. Current checks delegate to diagnostics/ios16-20F66/check_export.py; historical pins do not describe the v9/v10 build."]
completion = ["All selected components and their catalog dependencies have structured owning areas and all referenced local evidence exists.", "Future host verification requires a complete source revision, exact command and accessible clean-checkout result."]
limits = ["Only implemented/planned levels are assigned; historical dirty-tree results do not identify a complete device-verified published revision.", "Stock upstream reusable-workflow/catalog compatibility and complete companion-firmware publication remain pending."]
next_action = ["Keep exact current diagnostics separate from the root 8796.101.5 proposal. Review the diagnostic pins and 46-patch order before authorized work; complete root-proposal machine support and 20F66 component/prelink qualification separately."]
evidence = [{ kind = "source", reference = "board.toml", result = "G0345D identity, selected components and ordered source layers are configured." }, { kind = "source", reference = "docs/provenance/source-snapshot.json", result = "Historical M42 hashes remain unchanged, including 51 retired patch paths; current diagnostics are checked separately." }, { kind = "source", reference = "docs/provenance/github-initial-license.md", result = "Records the initial remote commit, archived license blob and retained source licensing." }, { kind = "source", reference = "tests/test_stage_os_profile.py", result = "Offline tests verify conflict-safe profile staging, including Windows junction rejection through reparse-point metadata." }]

[[area]]
id = "firmware"
status = "planned"
components = ["DarwinBoot"]
paths = ["docs/firmware-dependency.md", "docs/hardware.md"]
inputs = ["Legacy edk2-msm8998 based G0345D firmware with local platform, FdtLib, SimpleInit, BootShim and DarwinBoot changes.", "Fixed FD at 0x91700000, size 0x600000; firmware-owned memory and inherited RGB888 scanout."]
configuration = ["board.toml names g0345d.dsc and the GCC5 FD location as legacy metadata, not a working current Mu-Silicium recipe.", "The standard firmware integration and exact companion source delta are not yet published."]
procedure = ["Read the recorded firmware baselines and missing local changes in docs/firmware-dependency.md.", "Export a separate companion firmware repository with reviewed sources, licenses, pins and a clean build recipe before resuming firmware work."]
findings = ["Historical temporary boot reached DarwinBoot-to-XNU handoff, but this device repository alone cannot reproduce that firmware state.", "The current legacy FDF retains early RAW fixtures; its ordinary build.sh output does not reproduce the frozen M42 Android v0 container.", "On 2026-11-20 an isolated ext4 legacy companion snapshot completed a full GCC5/AARCH64 DEBUG build (build-full-03.log) with pinned Mu Advanced Logger producer/consumers and the UniXNU exporter. PlatformBootManagerLib now explicitly declares its existing SerialPortLib dependency. The 6291456-byte FD and 79945728-byte diagnostic image passed host packaging/readback and independent final-FV checks: twelve AARCH64 PE32+ FFS images match their built EFI files, and the logger constructor/consumer, PCD/model and serial chains pass. Temporary fastboot boot at 2026-11-20 17:33:30+08:00 and 17:47:52+08:00 returned exit 0 without partition writes; the first run displayed the Advanced Logger QR page. The saved OneSend log (74225 bytes, SHA-256 4ee86e32440940dd9eb8538e8a000918f28ba289474139d1932c7be2f176a388) confirms successful config open at \\EFI\\UniXNU\\unixnu.toml, 4 entries/0 skipped, menu display and Advanced Logger entry. Host FAT readback confirms the xnu entry, matching kernel/report hash and adjacent ADT/hash. The device log does not separately name xnu or log payload hashes; its capture ends at logger open before DarwinBoot. A PartitionValidMbr Bad MBR partition size diagnostic is retained but not yet shown to block payload loading. No current-run DarwinBoot, ExitBootServices or XNU entry is established."]
completion = ["A pinned companion repository reproduces the intended FD and loader handoff with documented lawful inputs.", "A new hardware result names the exact firmware, image and complete source revision."]
limits = ["The selected catalog DarwinBoot revision is not a complete description of the locally adapted nested firmware loader.", "PSCI, power ownership and general firmware services are not qualified as complete device functions."]
next_action = ["Preserve the photo-confirmed EBS-success/XNU-entry checkpoint and distinguish the subsequent start_first_cpu, bootstrap mapping and MMU boundaries. Keep the earlier logger capture separate from the later photograph and use temporary fastboot boot only for future tests."]
evidence = [{ kind = "source", reference = "docs/firmware-dependency.md", result = "Records the firmware baselines, missing changes and exact reproduction limits." }, { kind = "source", reference = "docs/bringup/official-flow-20261120.md", result = "Records pinned official stage order, isolated DEBUG build and artifact identities, explicit SerialPortLib dependency repair, final-FV checks, two accepted temporary boots, OneSend Stage 1/2 log evidence, host-side Stage 3 payload checks and the lack of current-run DarwinBoot/XNU entry evidence." }]

