configuration = ["Keep the fixed FD reservation at 0x91700000/0x600000 and the framebuffer reservation at 0x83401000/0x23ff000.", "CONFIG_XNU_DT_PANIC_REGION=y avoids a BCM2837 fixed panic-RAM assumption."]
procedure = ["Review all board and inherited SoC reservations before any memory-map change.", "Use the retained VM/framebuffer ladder and allocator probes to distinguish early mapping progress from later allocation behavior."]
findings = ["Historical framebuffer marks survive the early VM transition and M42 reaches allocator initialization.", "The current reservation overlaps and reusable/no-map pool semantics have been retained, not newly validated or reconciled during repository preparation.", "No general DMA/SMMU correctness follows from visible framebuffer probes.", "The isolated 2026-11-20 native-only XNU 8796.121.2 post-MMU diagnostic adds one bounded 2 MiB identity block at VA/PA 0x83400000 using Device-nGnRnE with PXN/UXN. Final linked TCR/MAIR and descriptor checks passed, with an occupied-parent refusal and the existing page-pool boundary retained. At its initial packaging this image had not been device-tested; later observations are summarized in the v9/v10 note. It does not qualify general translation or DMA behavior. See docs/bringup/stage5-postmmu-20261120.md.", "Latest iOS evidence is after early PE return. v10 changes nine ADT u64 fields (ten bytes): ranges=(0,0x60000,0x9fa0000), with seven reg offsets adjusted to preserve every physical address and length. FAT/ADT audits passed; this isolated 64KiB board adaptation is not unchanged official 16MiB generator output or general DMA/VM qualification."]
completion = ["Source describes the board DRAM and protected firmware windows without changing the frozen diagnostic layout.", "Complete memory qualification needs reconciled reservations, allocation progress and independently measured DMA/cache/SMMU behavior."]
limits = ["Fixed-zone creation has not been observed to return; the precise fault or progress condition is unknown.", "SMMU stream IDs, DMA widths and cache policy for working peripherals are not qualified."]
next_action = ["Preserve diagnostic guards and physical ranges. Measure the ADT clock-path candidate during an authorized temporary test before further changes; VM/DMA/SMMU qualification remains separate."]
