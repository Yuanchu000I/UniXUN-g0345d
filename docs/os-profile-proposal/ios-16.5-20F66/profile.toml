board_id = 0x06
# Component hashes, fetch members, and kernelcache/prelink inputs remain
# unresolved; do not run an IPSW-consuming build from this proposal.

[kernel]
patch_series = []
# Requires the profile-driven Linux/native-kernel tools compatibility patch.
# Expected target staging input. This does not select or implement XNU's machine
# config; the current BCM2837-only build path must be fixed before a target build.
native_kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_MSM8996/mach.development.msm8996.unstripped"
# No prelink values are copied from the NX769J donor. Derive kernelcache hash,
# slide, roots, and any security initializer against the selected restore image.

[kernel.linux]
sdk_version = "16.5"
triple = "arm64-apple-ios16.5"
