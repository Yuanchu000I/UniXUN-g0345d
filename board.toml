schema_version = 2

[board]
example = false
name = "g0345d"
soc = "msm8996"
soc_source = "msm8996"
os_profile = "ipados-17.7.11-21H461"
description = "Gree G0345D (格力手机 G3)"
kit = "g0345d"

[userdata]
# Real geometry from the stock QFIL rawprogram0.xml (LUN0): LBA 74312..14530554,
# 55.13 GiB of the 64 GB UFS 2.0 part, 4096 B LBA.  Partition neighbours for
# reference (LUN0): gpt_main0 0..5, ssd 6..7, persist 8..8199, cache
# 8200..73735, misc 73736..73991, keystore 73992..74119, devcfg 74120..74151,
# devcfgbak 74152..74183, frp 74184..74311.  On LUN4: boot 39690..56073,
# system 56074..842457, recovery 842506..866825.
first_lba = 74312
last_lba = 14530554
lba_bytes = 4096
windows = [{ name = "OS", component = "OS" }, { name = "SystemOS", component = "Cryptex1,SystemOS" }]

[kernel]
defconfig = "g0345d_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/msm8996.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu/series"]
# Same reasoning as g0245d: schema_version=2 archive_plan() switches to explicit
# mode once any component: entry exists, so the device layer must list the full
# set including the three MSM8996 drivers.
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "component:SoftwareAES",
  "component:NativeUfs8996",
  "component:Blsp8996",
  "component:Adreno530",
  "build-software-aes-bindings.py",
  "build-mockfs-fixture.py",
  "build-libpthread-kernel.py",
]

[firmware]
# The g0345d UEFI overlay (uefi-g0345d) builds with its own build.sh
# (--device g0345d --release RELEASE), GCC5 toolchain, and is packed by
# the historical private lab pipeline into the boot image. The unixnu firmware step is not
# used on this device yet; these entries document where the overlay lives.
config = "g0345d"
dsc = "Platforms/Msm8996Pkg/Device/gree/g0345d/g0345d.dsc"
fd = "Build/g0345d/{target}_GCC5/FV/MSM8996PKG_UEFI.fd"
packages = ["{uefi}", "{tree}/package", "{tree}/drivers/DarwinBoot", "{edk2}"]

[firmware.defines]
DEVICE_MODEL = "g0345d"

[payload]
volume = "G0345D"
# 24 MiB — the payload rides in boot.img's ramdisk slot and is delivered by
# fastboot boot (RAM boot; the 64 MiB flash boot partition is irrelevant to
# the image size).  Verified end to end on 2026-11-14: a 24 MiB FAT16 payload
# in the ramdisk slot boots and UniXNU reads its config from it.
size_mib = 24
loader = "firmware"
title = "UniXNU"
# Stock boot.img (Android v0 header) facts, parsed from the restore package:
#   kernel_addr 0x80008000, ramdisk_addr 0x81000000, tags_addr 0x80000100,
#   page_size 4096, kernel 54773873 B (gz 8565237 + appended DTB 46208636),
#   ramdisk 8694484 B, header_version 0, header cmdline empty.
kernel_args = ["-v", "serial=3", "console=ttyHSL0,115200,n8"]
dram_size = "0x100000000"

[payload.adt]
chip_id = "820"
unique_chip_id = "required"

[bootimg]
# cont_splash_region, verbatim from the stock DTS:
#   cont_splash_mem@83401000 { reg = <0x00 0x83401000 0x00 0x23ff000>; }
#
# [VERIFIED on hardware] The scanout LK/ABL leaves behind is 24bpp:
#   panel 1080x2160, stride 3240 B = 1080 px, budget 1080x2160x3 = 7.0 MB
#   of the 36 MB carveout.  The firmware (SimpleFbDxe / DarwinBoot DiagDraw)
#   and the stage-4 fixture both draw through this scanout.
dtb_node = [{ path = "/reserved-memory/splash_region", props = [{ name = "label", type = "s", value = "cont_splash_region" }, { name = "reg", type = "x", value = ["0x0", "0x83401000", "0x0", "0x23ff000"] }] }]

# mkbootimg v0 parameters, mirroring the stock boot.img header fields
# (verified: repack_exact.py keeps the kernel section byte-identical and the
# device boots; kernel_addr 0x80008000, ramdisk_addr 0x81000000).
# Legacy keys below are retained as hardware history, not migrated release inputs.
# Current official tools use [bootimg.image]; see docs/firmware-dependency.md.
[boot_image]
base = "0x80000000"
kernel_offset = "0x8000"
ramdisk_offset = "0x1000000"
second_offset = "0xf00000"
tags_offset = "0x100"
pagesize = 4096
header_version = 0

# UniXNU UEFI firmware volume destination: the g0345d overlay FDF places the
# FD at 0x91700000, size 0x600000 (6 MiB), in the free window above the aboot
# image (0x91600000..) and below cont_splash_mem_hdmi (0xb1c00000).
[uefi_fd]
base = "0x91700000"
size = "0x600000"

[boot_shim]
# The stock kernel is an ARM64 Image (magic 'ARMd', verified: LK checks
# kernel+0x38 for it) loaded at 0x80008000; the shim must present the same
# header shape so aboot accepts the decompressed stream and jumps to
# kernel_entry with x0 = appended DTB.
requires_kernel_header = true

[device_tree]
source = "device:dts/g0345d.dts"
include_dirs = ["soc:dts"]

# Prelink is skipped on this device (build kernel --skip-prelink), so no
# kernelcache is needed yet.  When prelink lands, point kernelcache at a local
# decompressed 21H461 kernelcache like g0245d does.
[kernel.prelink]

# [ipsw] metadata comes from the os profile; --skip-prelink builds never
# download the 6.8 GiB IPSW.
[ipsw]

[components]
# Stage 1 set: platform, CPU, crypto, loader — baseline bring-up, plus the
# three MSM8996 native driver components (probe-only scaffolds, see g0245d).
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot", "NativeUfs8996", "Blsp8996", "Adreno530", "Msm8996Platform"]

[adt]

[adt.product]

[adt.product.string]
model = "gree,g0345d"
artwork-display-gamut = "sRGB"

[adt.product.u32]
thin-bezel = 1

[adt.defaults]

[adt.defaults.u32]
sleep-disabled = 1

[adt.buttons]

[adt.buttons.string]
compatible = "buttons"
device_type = "buttons"

[adt.buttons.strings]
button-names = ["hold", "voldown", "volup"]

[adt.buttons.u32]
home-button-type = 2

# Official package interface; clean release remains blocked as documented.
[package]
unixnu = "../UniXNU"

[package.defconfig]
"ipados-17.7.11-21H461" = "g0345d_defconfig"
