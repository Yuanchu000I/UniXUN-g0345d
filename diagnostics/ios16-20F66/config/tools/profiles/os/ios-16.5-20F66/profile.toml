[os]
name = "ios-16.5-20F66"
arch = "arm64"
target = "ios"
ios_version = "16.5"
darwin = "22.5.0"
xnu_version = "8796.121.2"
xnu_revision = "c54f35ca767986246321eb901baf8f5ff7923f6a"
driverkit_tag = "xnu-8796.121.2"
trustcache_tag = "xnu-8796.121.2"
abi = []

# The restore identity below selects the iPhone OS family donor. It does not
# describe the G0345D board, SoC, device tree, or firmware.
[ipsw]
url = "https://updates.cdn-apple.com/2023SpringFCS/fullrestores/032-85130/6AB0D10A-8AF9-4F6C-8CF5-A1B315CABE88/iPhone10,3,iPhone10,6_16.5_20F66_Restore.ipsw"
product = "iPhone10,3"
version = "16.5"
build = "20F66"
# These restore identity fields were verified from the 20F66 BuildManifest.
# They identify the iPhone OS donor, not G0345D.
device_class = "d22ap"
chip_id = 0x8015
board_id = 0x06
# Component hashes, fetch members, and kernelcache/prelink inputs remain
# unresolved; do not run an IPSW-consuming build from this proposal.

[kernel]
patch_series = []
# Requires the profile-driven Linux/native-kernel tools compatibility patch.
native_kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_MSM8996/mach.development.msm8996.unstripped"
# No prelink values are copied from the NX769J donor. Derive kernelcache hash,
# slide, roots, and any security initializer against the selected restore image.

[kernel.linux]
sdk_version = "16.5"
triple = "arm64-apple-ios16.5"

# Apple distribution-macOS macos-133 pairs this pthread revision with the
# exact XNU8796.121.2 commit selected above. Keep Darwin23 defaults unchanged.
[[source]]
name = "libpthread"
kind = "refer"
git = "https://github.com/apple-oss-distributions/libpthread.git"
ref = "libpthread-514.100.2"
commit = "a6c70ca0e544347a0377babf748f831577ec24f9"
